program: pretrain_simple.py
name: TEST SWEEP
method: grid

metric:
  name: val/exact_accuracy_pct
  goal: maximize

parameters:
  curriculum_type:
    values: ['null', 'diff_max_len']

  end_after_n_examples:
    value: 2000
  batch_size:
    value: 128
  eval_interval:
    value: 10


command:
  - ${env}
  - python
  - ${program}
  - ${args_no_hyphens}