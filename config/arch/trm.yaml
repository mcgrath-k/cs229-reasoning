name: recursive_reasoning.trm@TinyRecursiveReasoningModel_ACTV1
loss:
  name: losses@LossHead
  loss_type: stablemax_cross_entropy

# New parameter to set fixed number of reasoning steps
# replaces ACT
# TODO: what is a good default value here?
max_reasoning_steps: 10 

H_cycles: 3
L_cycles: 4

H_layers: 0
L_layers: 2

max_seq_len: 10000 # Arbitrary maximum seq_len for rope. 
# If we truly need to remove the notion of a 'maximum', need to look into RoPE successor papers.

hidden_size: 512
num_heads: 8  # min(2, hidden_size // 64)
expansion: 4

pos_encodings: rope
forward_dtype: bfloat16

mlp_t: False # use mlp on L instead of transformer