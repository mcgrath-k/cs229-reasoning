# ARC training config

defaults:
  - arch: trm
  - _self_

hydra:
  output_subdir: null


project_name: arithmetic

dataset_is_remote: True
dataset_path: mkyle/addition_dataset_5_million

scoring_func: max_len

# Use if local
# dataset_path: data/addition_dataset_big_scored_max_len

# Hyperparams - Training
batch_size: 512 # Reduce for smaller machines

curriculum_threshold: 0.80
mix_curriculum_ratio: 1

max_reasoning_steps: 10  # Fixed number of reasoning steps 

epochs: 100000 # Arbitrarily large to not stop early
eval_interval: 100 # How often to run validation
save_interval: 2000 # How often to save the model
checkpoint_every_epoch: False

lr: 5e-4
lr_min_ratio: 1.0
lr_warmup_steps: 2000

# Standard hyperparameter settings for LM, as used in Llama
beta1: 0.9
beta2: 0.95
weight_decay: 0.1

seed: 0
min_eval_interval: 0 # when to start the eval

ema: False # use Exponential-Moving-Average
ema_rate: 0.999 # EMA-rate
freeze_weights: False # If True, freeze weights and only learn the embeddings